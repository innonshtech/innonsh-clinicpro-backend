name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint --if-present

    - name: Run Build
      run: npm run build
      env:
        # Dummy variables required for Next.js build to succeed if it attempts static generation
        MONGODB_URI: "mongodb://127.0.0.1:27017/test"
        JWT_SECRET: "dummy_secret"
        JWT_REFRESH_SECRET: "dummy_secret"
        BACKUP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
